name: Publish branch image (GHCR + Docker Hub, multi-arch)

# Pre-release publisher for a branch. Runs automatically on every push to the
# default branch and can still be dispatched manually, e.g.:
#   gh workflow run docker-image-branch.yml -f branch=main
# It pushes two moving tags per registry and never touches `latest`, so it can
# run alongside the release workflow (docker-build.yml):
#   ghcr.io/<owner>/<repo>:<branch>            docker.io/kapul/newapi-kapul:<branch>
#   ghcr.io/<owner>/<repo>:<branch>-<date>-<sha>  … same on Docker Hub
#
# Registries: GHCR via the built-in GITHUB_TOKEN, Docker Hub via secret KAPUL.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch, tag or SHA to build (e.g. main)'
        required: true
        type: string

# Serialize runs so two consecutive pushes cannot interleave writes to the same
# moving tag and leave the multi-arch manifest rebuilt from a half-published pair.
concurrency:
  group: branch-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare image tags
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      sha: ${{ steps.version.outputs.sha }}
      tag_prefix: ${{ steps.version.outputs.tag_prefix }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Check out ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch || github.ref }}

      - name: Resolve image tags
        id: version
        env:
          REF_NAME: ${{ inputs.branch || github.ref_name }}
        run: |
          TAG_PREFIX=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          TAG_PREFIX=${TAG_PREFIX:0:105}
          TAG_PREFIX=$(printf '%s' "$TAG_PREFIX" | sed -E 's/[.-]+$//')
          if [ -z "$TAG_PREFIX" ]; then
            echo "::error::Ref '$REF_NAME' cannot be converted to a valid Docker tag prefix"
            exit 1
          fi

          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${TAG_PREFIX}-$(date +'%Y%m%d')-${SHORT_SHA}"

          echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$TAG_PREFIX" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Prepared image tags for $REF_NAME at $SHORT_SHA"

  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DOCKERHUB_IMAGE: docker.io/kapul/newapi-kapul
    steps:
      - name: Check out ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Write VERSION
        run: |
          echo "${{ needs.prepare.outputs.version }}" > VERSION
          echo "Publishing version: ${{ needs.prepare.outputs.version }} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: kapul
          password: ${{ secrets.KAPUL }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}

      - name: Build & push single-arch
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ needs.prepare.outputs.tag_prefix }}-${{ matrix.arch }}
            ${{ env.GHCR_IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.prepare.outputs.tag_prefix }}-${{ matrix.arch }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=branch-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=branch-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Image summary
        run: |
          echo "### ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${GHCR_IMAGE}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${DOCKERHUB_IMAGE}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Create multi-arch manifests
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DOCKERHUB_IMAGE: docker.io/kapul/newapi-kapul
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: kapul
          password: ${{ secrets.KAPUL }}

      - name: Create & push manifests
        run: |
          for IMAGE in "${GHCR_IMAGE}" "${DOCKERHUB_IMAGE}"; do
            docker buildx imagetools create \
              -t "${IMAGE}:${{ needs.prepare.outputs.tag_prefix }}" \
              "${IMAGE}:${{ needs.prepare.outputs.tag_prefix }}-amd64" \
              "${IMAGE}:${{ needs.prepare.outputs.tag_prefix }}-arm64"
            docker buildx imagetools create \
              -t "${IMAGE}:${{ needs.prepare.outputs.version }}" \
              "${IMAGE}:${{ needs.prepare.outputs.version }}-amd64" \
              "${IMAGE}:${{ needs.prepare.outputs.version }}-arm64"
            echo "### ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            docker buildx imagetools inspect "${IMAGE}:${{ needs.prepare.outputs.tag_prefix }}" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            docker buildx imagetools inspect "${IMAGE}:${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
